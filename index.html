<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>法規智慧顧問 · 高雄長庚急診</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1A;
    --surface: #111827;
    --surface2: #1C2333;
    --border: #2A3548;
    --red: #FF3B3B;
    --red-dim: rgba(255,59,59,0.12);
    --orange: #FF8C00;
    --orange-dim: rgba(255,140,0,0.12);
    --green: #00C896;
    --green-dim: rgba(0,200,150,0.12);
    --yellow: #FFD600;
    --yellow-dim: rgba(255,214,0,0.12);
    --blue: #4A9EFF;
    --blue-dim: rgba(74,158,255,0.12);
    --text: #E8EDF5;
    --text2: #8A98B0;
    --text3: #4A5568;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans TC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .header-title { font-size: 14px; font-weight: 700; letter-spacing: 0.05em; }
  .header-sub { font-size: 11px; color: var(--text2); margin-left: auto; font-family: var(--mono); }

  main { flex: 1; padding: 16px; max-width: 540px; margin: 0 auto; width: 100%; }

  .chips-label { font-size: 11px; color: var(--text3); margin-bottom: 8px; font-family: var(--mono); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    font-size: 11px; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: 20px;
    cursor: pointer; background: var(--surface); color: var(--text2);
    font-family: var(--sans); transition: all 0.12s; white-space: nowrap;
  }
  .chip:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }

  .input-area {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  .input-area:focus-within { border-color: var(--blue); }
  textarea {
    width: 100%; background: transparent; border: none; outline: none;
    font-family: var(--sans); font-size: 14px; color: var(--text);
    resize: none; min-height: 72px; line-height: 1.6;
  }
  textarea::placeholder { color: var(--text3); }
  .input-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .char-count { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .submit-btn {
    background: var(--red); color: white; border: none; border-radius: 6px;
    padding: 8px 20px; font-family: var(--sans); font-size: 13px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: all 0.15s; letter-spacing: 0.03em;
  }
  .submit-btn:hover { opacity: 0.85; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .thinking {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; text-align: center;
    color: var(--text2); font-size: 13px; display: none;
  }
  .thinking.show { display: block; }
  .thinking-bar { height: 2px; background: var(--border); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .thinking-fill { height: 100%; background: var(--blue); border-radius: 2px; animation: thinking 1.5s ease-in-out infinite; }
  @keyframes thinking { 0%{width:0%;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0%;margin-left:100%} }

  .result-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; margin-bottom: 12px;
    animation: slideIn 0.25s ease; display: none;
  }
  .result-card.show { display: block; }
  @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .verdict { padding: 16px; border-bottom: 1px solid var(--border); }
  .verdict-level { font-size: 22px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.2; margin-bottom: 4px; }
  .verdict-level.red { color: var(--red); }
  .verdict-level.orange { color: var(--orange); }
  .verdict-level.green { color: var(--green); }
  .verdict-level.yellow { color: var(--yellow); }
  .verdict-level.blue { color: var(--blue); }
  .verdict-sub { font-size: 12px; color: var(--text2); line-height: 1.5; }

  .section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; font-family: var(--mono); }

  .checklist { list-style: none; }
  .checklist li { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 13px; color: var(--text); line-height: 1.5; border-bottom: 1px solid var(--border); }
  .checklist li:last-child { border-bottom: none; }
  .check-box { width: 16px; height: 16px; border: 1.5px solid var(--text3); border-radius: 3px; flex-shrink: 0; margin-top: 2px; }

  .role-list { list-style: none; }
  .role-item { display: flex; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .role-item:last-child { border-bottom: none; }
  .role-name { color: var(--blue); font-weight: 500; min-width: 100px; flex-shrink: 0; font-size: 12px; }
  .role-arrow { color: var(--text3); margin: 0 6px; flex-shrink: 0; }
  .role-task { color: var(--text); flex: 1; line-height: 1.5; }

  .source-line { font-family: var(--mono); font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .error-card {
    background: var(--red-dim); border: 1px solid rgba(255,59,59,0.3);
    border-radius: 12px; padding: 14px 16px; font-size: 13px;
    color: var(--red); display: none;
  }
  .error-card.show { display: block; }

  footer { text-align: center; padding: 16px; font-family: var(--mono); font-size: 10px; color: var(--text3); border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <div class="header-dot"></div>
  <div class="header-title">法規智慧顧問</div>
  <div class="header-sub">高雄長庚急診</div>
</header>

<main>

  <div class="chips-label">常見情境快速輸入</div>
  <div class="chips">
    <div class="chip" onclick="setQ('8位重傷、4位中傷、10位輕傷同時入院，現在是夜間')">夜間22人入院</div>
    <div class="chip" onclick="setQ('發生化學物質外洩，有多名傷患吸入毒氣送來急診')">毒化災傷患</div>
    <div class="chip" onclick="setQ('大樓火災，有燒燙傷及吸入性損傷傷患陸續送達')">火災燒燙傷</div>
    <div class="chip" onclick="setQ('加護病房已滿床，急診有重傷患需要ICU')">ICU床位不足</div>
    <div class="chip" onclick="setQ('ECMO機器只剩1台，有新的重症患者需要使用')">ECMO緊急調度</div>
    <div class="chip" onclick="setQ('大量傷患狀況已經穩定，如何宣布解除？')">狀況解除程序</div>
  </div>

  <div class="input-area">
    <textarea id="q-input"
      placeholder="描述目前的實務情境，例如：現在是假日晚上，急診突然來了30位地震傷患，請問如何處理？"
      oninput="updateChar()" maxlength="500"></textarea>
    <div class="input-footer">
      <span class="char-count" id="char-count">0 / 500</span>
      <button class="submit-btn" id="submit-btn" onclick="query()">
        查詢 <span>→</span>
      </button>
    </div>
  </div>

  <div class="thinking" id="thinking">
    正在查詢法規知識庫並分析情境…
    <div class="thinking-bar"><div class="thinking-fill"></div></div>
  </div>

  <div class="result-card" id="result-card">
    <div class="verdict" id="verdict-area"></div>
    <div class="section" id="action-area"></div>
    <div class="section" id="role-area"></div>
    <div class="section" id="source-area"></div>
  </div>

  <div class="error-card" id="error-card"></div>

</main>

<footer>高雄長庚急診醫學部 · 法規智慧顧問系統</footer>

<script>
// Worker 網址（固定，不需要改）
const WORKER_URL = 'https://legal-advisor-api.cgmhsys.workers.dev';

function updateChar() {
  const len = document.getElementById('q-input').value.length;
  document.getElementById('char-count').textContent = `${len} / 500`;
}

function setQ(text) {
  document.getElementById('q-input').value = text;
  updateChar();
  document.getElementById('q-input').focus();
}

function setLoading(on) {
  document.getElementById('thinking').className = 'thinking' + (on ? ' show' : '');
  document.getElementById('submit-btn').disabled = on;
  document.getElementById('result-card').className = 'result-card';
  document.getElementById('error-card').className = 'error-card';
}

function showError(msg) {
  const el = document.getElementById('error-card');
  el.textContent = '⚠ ' + msg;
  el.className = 'error-card show';
}

function renderResult(result) {
  const v = result.verdict;

  document.getElementById('verdict-area').innerHTML = `
    <div class="verdict-level ${v.color}">${v.emoji} ${v.level}</div>
    <div class="verdict-sub">${v.sub}</div>
  `;

  const actions = (result.actions || []).map(a =>
    `<li><div class="check-box"></div><span>${a}</span></li>`
  ).join('');
  document.getElementById('action-area').innerHTML = `
    <div class="section-title">立即執行</div>
    <ul class="checklist">${actions}</ul>
  `;

  const roles = (result.roles || []).map(r =>
    `<li class="role-item">
      <span class="role-name">${r.name}</span>
      <span class="role-arrow">→</span>
      <span class="role-task">${r.task}</span>
    </li>`
  ).join('');
  document.getElementById('role-area').innerHTML = `
    <div class="section-title">各職稱任務</div>
    <ul class="role-list">${roles}</ul>
  `;

  document.getElementById('source-area').innerHTML = `
    <div class="source-line">
      <span>📄</span>
      <span>${result.source || '—'}</span>
      <span>·</span>
      <span>${result.date || '—'}</span>
    </div>
  `;

  document.getElementById('result-card').className = 'result-card show';
}

async function query() {
  const situation = document.getElementById('q-input').value.trim();
  if (!situation) return;

  setLoading(true);

  try {
    const resp = await fetch(`${WORKER_URL}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ situation })
    });

    const data = await resp.json();

    if (data.error) throw new Error(data.error);
    renderResult(data);

  } catch(e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) query();
});
</script>
</body>
</html>
