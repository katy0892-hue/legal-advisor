<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄長庚 法規問答系統</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
  .container { width: 100%; max-width: 720px; }
  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 18px; font-weight: 500; }
  .header p { font-size: 13px; color: #888; margin-top: 4px; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #e0e0e0; padding: 1.25rem; margin-bottom: 1rem; }
  .card-secondary { background: #f5f5f3; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .label { font-size: 12px; color: #888; margin-bottom: 6px; }
  input[type="password"], input[type="text"], textarea {
    width: 100%; padding: 10px 12px; border: 0.5px solid #d0d0d0; border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; color: #1a1a1a;
    outline: none; transition: border-color 0.15s;
  }
  input:focus, textarea:focus { border-color: #999; }
  textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
  button {
    padding: 9px 18px; border: 0.5px solid #d0d0d0; border-radius: 8px;
    background: #fff; color: #1a1a1a; font-size: 14px; font-family: inherit;
    cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: #f0f0ee; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn-primary:hover { background: #333; }
  .btn-small { font-size: 12px; padding: 4px 10px; color: #888; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .answer-label { font-size: 13px; color: #888; margin-bottom: 12px; }
  .answer-text { font-size: 15px; line-height: 1.8; }
  .answer-text p { margin-bottom: 0.75rem; }
  .answer-text p:last-child { margin-bottom: 0; }
  .answer-text strong { font-weight: 500; }
  .answer-text .section-title { font-size: 12px; font-weight: 500; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin: 1.25rem 0 0.5rem; padding-bottom: 4px; border-bottom: 0.5px solid #e8e8e8; }
  .answer-text .section-title:first-child { margin-top: 0; }
  .answer-text ol { padding-left: 0; list-style: none; margin: 0.5rem 0; }
  .answer-text ol li { display: flex; gap: 10px; padding: 5px 0; font-size: 14px; line-height: 1.6; border-bottom: 0.5px solid #f0f0ee; }
  .answer-text ol li:last-child { border-bottom: none; }
  .answer-text ol li .step-num { min-width: 22px; height: 22px; border-radius: 50%; background: #1a1a1a; color: #fff; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .answer-text ol li .step-txt { flex: 1; }
  .contact-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #f5f5f3; border-radius: 8px; }
  .contact-left { display: flex; align-items: center; gap: 10px; }
  .contact-avatar { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 0.5px solid #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .contact-name { font-size: 14px; font-weight: 500; }
  .contact-gsm { font-size: 13px; color: #888; font-family: monospace; }
  .meta-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .meta-box { background: #fff; border: 0.5px solid #e0e0e0; border-radius: 8px; padding: 8px 12px; flex: 1; min-width: 140px; }
  .meta-label { font-size: 11px; color: #aaa; margin-bottom: 3px; }
  .meta-value { font-size: 13px; font-weight: 500; }
  .error-box { background: #fff5f5; border: 0.5px solid #fcc; border-radius: 8px; padding: 1rem; }
  .error-text { font-size: 14px; color: #c00; }
  .loading { display: flex; align-items: center; gap: 10px; padding: 1rem 0; }
  .loading-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .loading-text { font-size: 14px; color: #888; }
  .divider { border: none; border-top: 0.5px solid #e8e8e8; margin: 1.25rem 0; }
  .question-display { font-size: 15px; font-weight: 500; }
  .question-label { font-size: 13px; color: #888; margin-bottom: 6px; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; display: inline-block; margin-right: 6px; }
  .status-dot.connected { background: #4caf50; }
  .status-text { font-size: 13px; color: #888; }
  #mainPanel { display: none; }
  #setupPanel {}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>大量傷患救護法規問答系統</h1>
    <p>高雄長庚紀念醫院 急診醫學部</p>
  </div>

  <!-- Setup Panel -->
  <div id="setupPanel">
    <div class="card">
      <div class="label">🔑 設定 API Keys</div>
      <p style="font-size:13px;color:#888;margin-bottom:12px;">需要兩組 Key：Anthropic（回答問題）與 Airtable（讀取法規資料）</p>
      <div style="margin-bottom:10px;">
        <div class="label">Anthropic API Key</div>
        <input type="password" id="anthropicKeyInput" placeholder="sk-ant-..." />
      </div>
      <div style="margin-bottom:12px;">
        <div class="label">Airtable Personal Access Token</div>
        <input type="password" id="airtableKeyInput" placeholder="pat..." />
        <p style="font-size:11px;color:#aaa;margin-top:4px;">至 airtable.com → 帳號設定 → Developer Hub → Personal Access Token 建立，需要 data.records:read 權限</p>
      </div>
      <button class="btn-primary" onclick="saveKeys()" style="width:100%;">確認並載入法規資料</button>
    </div>
  </div>

  <!-- Main Panel -->
  <div id="mainPanel">
    <div class="top-bar">
      <div>
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">載入中...</span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-small" onclick="reloadData()">重新載入資料</button>
        <button class="btn-small" onclick="clearKeys()">重設</button>
      </div>
    </div>

    <div class="card" style="padding:1rem;">
      <textarea id="questionInput" placeholder="輸入問題或描述情境，例如：&#10;現在是晚上11點，來了35個傷患其中8人重大外傷，我要怎麼做？&#10;&#10;ECMO只剩1台同時ICU也快滿了怎麼辦？"></textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
        <div class="chips">
          <button class="btn-small" onclick="quickAsk('現在晚上11點，來了35個傷患，其中8人重大外傷，我要怎麼做？')">夜間情境</button>
          <button class="btn-small" onclick="quickAsk('ECMO只剩1台，同時ICU也快滿了，怎麼辦？')">資源緊缺</button>
          <button class="btn-small" onclick="quickAsk('來了一批燒燙傷患者，電腦系統突然故障，步驟是什麼？')">複合情境</button>
          <button class="btn-small" onclick="quickAsk('指揮官是誰？夜間假日由誰代理？')">指揮體系</button>
        </div>
        <button class="btn-primary" onclick="askQuestion()" id="askBtn" style="white-space:nowrap;margin-left:8px;">送出 ↗</button>
      </div>
    </div>

    <div id="answerArea" style="display:none;">
      <hr class="divider">
      <div style="margin-bottom:1.25rem;">
        <div class="question-label">您的問題</div>
        <div class="question-display" id="displayQuestion"></div>
      </div>

      <div id="loadingIndicator" style="display:none;">
        <div class="loading">
          <div class="loading-dot"></div>
          <span class="loading-text" id="loadingMsg">Claude 正在分析法規資料...</span>
        </div>
      </div>

      <div id="answerContent" style="display:none;">
        <div class="card-secondary">
          <div class="answer-label">✦ 回答</div>
          <div class="answer-text" id="answerText"></div>
        </div>

        <div id="contactsCard" class="card" style="display:none;">
          <div class="answer-label">👥 相關聯繫人</div>
          <div id="contactsList" style="display:flex;flex-direction:column;gap:8px;margin-top:4px;"></div>
        </div>

        <div class="meta-row">
          <div class="meta-box">
            <div class="meta-label">參考來源</div>
            <div class="meta-value" id="sourceText"></div>
          </div>
        </div>

        <div id="errorMsg" class="error-box" style="display:none;margin-top:1rem;">
          <div class="error-text" id="errorText"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const BASE_ID = 'app4I4h25azllFSve';
const TABLE_ID = 'tblaKjjZVMCnKdsNT';
let qaData = [];

function saveKeys() {
  const ak = document.getElementById('anthropicKeyInput').value.trim();
  const at = document.getElementById('airtableKeyInput').value.trim();
  if (!ak.startsWith('sk-ant-')) { alert('請輸入正確的 Anthropic API Key（以 sk-ant- 開頭）'); return; }
  if (!at.startsWith('pat')) { alert('請輸入正確的 Airtable Personal Access Token（以 pat 開頭）'); return; }
  localStorage.setItem('cgmh_anthropic_key', ak);
  localStorage.setItem('cgmh_airtable_key', at);
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('mainPanel').style.display = 'block';
  loadAirtableData();
}

function clearKeys() {
  localStorage.removeItem('cgmh_anthropic_key');
  localStorage.removeItem('cgmh_airtable_key');
  document.getElementById('setupPanel').style.display = 'block';
  document.getElementById('mainPanel').style.display = 'none';
}

async function loadAirtableData() {
  const token = localStorage.getItem('cgmh_airtable_key');
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '載入法規資料中...';
  try {
    let records = [], offset = null;
    do {
      const url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}?pageSize=100${offset ? '&offset=' + offset : ''}`;
      const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Airtable 讀取失敗：' + res.status);
      const data = await res.json();
      records = records.concat(data.records);
      offset = data.offset;
    } while (offset);

    qaData = records.map(r => ({
      key: r.fields['問題關鍵字'] || '',
      questions: r.fields['常見問法'] || '',
      answer: r.fields['標準答案'] || '',
      source: r.fields['來源條文'] || '',
      steps: r.fields['行動步驟'] || '',
      role: r.fields['負責角色'] || '',
    })).filter(r => r.key);

    document.getElementById('statusDot').className = 'status-dot connected';
    document.getElementById('statusText').textContent = `已載入 ${qaData.length} 筆法規資料`;
  } catch (err) {
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = '載入失敗：' + err.message;
  }
}

function reloadData() { loadAirtableData(); }

function buildSystemPrompt() {
  let prompt = `你是高雄長庚紀念醫院「大量傷患救護」的法規問答助理。
請根據以下院內法規問答資料庫，回答使用者的問題或情境。

回答格式規則：
1. 只根據資料庫內容回答，不要自行發明資訊
2. 情境題請先用一段話說明適用條件（動員等級、時段、災難類型）
3. 步驟請用數字清單（1. 2. 3.），每步獨立一行
4. 聯繫人請用「**姓名**（職稱）GSM:xxxxx」格式
5. 重要判斷結論用 **粗體** 標示
6. 回答用繁體中文
7. 最後一行：【來源：xxx】

=== 法規問答資料庫 ===\n\n`;

  qaData.forEach(qa => {
    prompt += `【${qa.key}】\n`;
    if (qa.questions) prompt += `問：${qa.questions}\n`;
    if (qa.answer) prompt += `答：${qa.answer}\n`;
    if (qa.steps) prompt += `步驟：${qa.steps}\n`;
    if (qa.role) prompt += `聯繫：${qa.role}\n`;
    if (qa.source) prompt += `來源：${qa.source}\n`;
    prompt += '\n';
  });
  return prompt;
}

function renderAnswer(text) {
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = escaped.split('\n');
  let html = '', inOl = false, stepCount = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) { if (inOl) { html += '</ol>'; inOl = false; stepCount = 0; } continue; }
    const olMatch = line.match(/^(\d+)[\.、]\s*(.+)/);
    if (olMatch) {
      if (!inOl) { html += '<ol>'; inOl = true; stepCount = 0; }
      stepCount++;
      const txt = olMatch[2].replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html += `<li><span class="step-num">${stepCount}</span><span class="step-txt">${txt}</span></li>`;
      continue;
    }
    if (inOl) { html += '</ol>'; inOl = false; stepCount = 0; }
    const isSectionTitle = /^\*\*[^*]+\*\*$/.test(line) || /^#{1,3}\s/.test(line) || (line.endsWith('：') && line.length < 20);
    if (isSectionTitle) {
      const t = line.replace(/^\*\*|\*\*$/g,'').replace(/^#{1,3}\s*/,'');
      html += `<div class="section-title">${t}</div>`;
      continue;
    }
    const para = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html += `<p>${para}</p>`;
  }
  if (inOl) html += '</ol>';
  return html;
}

function parseContacts(text) {
  const results = [];
  const pattern = /\*\*([^*]+)\*\*[（(]([^）)]+)[）)]\s*GSM[:：]\s*([\d\-]+)/g;
  let m;
  while ((m = pattern.exec(text)) !== null) {
    results.push({ name: m[1], title: m[2], gsm: m[3] });
  }
  return results;
}

function quickAsk(q) {
  document.getElementById('questionInput').value = q;
  askQuestion();
}

async function askQuestion() {
  const q = document.getElementById('questionInput').value.trim();
  if (!q) return;
  if (qaData.length === 0) { alert('法規資料尚未載入，請稍候或點擊「重新載入資料」'); return; }
  const apiKey = localStorage.getItem('cgmh_anthropic_key');
  if (!apiKey) { clearKeys(); return; }

  document.getElementById('answerArea').style.display = 'block';
  document.getElementById('displayQuestion').textContent = q;
  document.getElementById('loadingIndicator').style.display = 'block';
  document.getElementById('answerContent').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('askBtn').disabled = true;

  const msgs = ['Claude 正在分析法規資料...', '比對適用條文中...', '整理回答內容...'];
  let mi = 0;
  const timer = setInterval(() => { mi = (mi+1) % msgs.length; document.getElementById('loadingMsg').textContent = msgs[mi]; }, 1800);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1000,
        system: buildSystemPrompt(),
        messages: [{ role: 'user', content: q }]
      })
    });
    clearInterval(timer);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'API 錯誤 ' + res.status);

    const fullText = data.content?.[0]?.text || '';
    const sourceMatch = fullText.match(/【來源：([^】]+)】/);
    const cleanText = fullText.replace(/【來源：[^】]+】/g, '').trim();

    document.getElementById('loadingIndicator').style.display = 'none';
    document.getElementById('answerContent').style.display = 'block';
    document.getElementById('answerText').innerHTML = renderAnswer(cleanText);
    document.getElementById('sourceText').textContent = sourceMatch ? sourceMatch[1] : '大量傷患救護作業要點';

    const contacts = parseContacts(fullText);
    if (contacts.length > 0) {
      document.getElementById('contactsCard').style.display = 'block';
      document.getElementById('contactsList').innerHTML = contacts.map(c => `
        <div class="contact-row">
          <div class="contact-left">
            <div class="contact-avatar">👤</div>
            <div>
              <div class="contact-name">${c.name}</div>
              <div style="font-size:12px;color:#888;">${c.title}</div>
            </div>
          </div>
          <span class="contact-gsm">GSM ${c.gsm}</span>
        </div>
      `).join('');
    } else {
      document.getElementById('contactsCard').style.display = 'none';
    }
  } catch (err) {
    clearInterval(timer);
    document.getElementById('loadingIndicator').style.display = 'none';
    document.getElementById('answerContent').style.display = 'block';
    document.getElementById('answerText').textContent = '';
    document.getElementById('contactsCard').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorText').textContent = '發生錯誤：' + err.message;
  }
  document.getElementById('askBtn').disabled = false;
}

document.getElementById('questionInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askQuestion(); }
});

// 自動初始化
if (localStorage.getItem('cgmh_anthropic_key') && localStorage.getItem('cgmh_airtable_key')) {
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('mainPanel').style.display = 'block';
  loadAirtableData();
}
</script>
</body>
</html>
